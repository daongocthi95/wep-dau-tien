<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Rắn Săn Mồi</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: #ffe4ec;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    h1 { color: #8a2b4d; font-size: 24px; margin: 6px 0; }

    .bang {
      display: flex;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 17px;
      color: #8a2b4d;
      font-weight: bold;
    }
    .bang div {
      background: #fff;
      padding: 6px 14px;
      border-radius: 8px;
    }

    #khungGame { position: relative; line-height: 0; }

    canvas {
      border: 4px solid #e0507d;
      border-radius: 10px;
      background: #fff;
      touch-action: none; /* để vuốt không làm cuộn trang */
    }

    #phu {
      position: absolute;
      inset: 4px;
      background: rgba(255, 255, 255, 0.88);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      line-height: 1.4;
      padding: 16px;
    }
    #phu h2 { color: #8a2b4d; margin: 0 0 8px; font-size: 24px; }
    #phu p { color: #555; margin: 0 0 14px; font-size: 15px; }

    button {
      background-color: #e0507d;
      color: white;
      border: none;
      padding: 12px 26px;
      font-size: 17px;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background-color: #b93a63; }

    /* Bốn nút mũi tên cho điện thoại */
    #dieuKhien {
      display: grid;
      grid-template-columns: repeat(3, 66px);
      grid-template-rows: repeat(2, 66px);
      gap: 8px;
      margin-top: 14px;
      justify-content: center;
    }
    #dieuKhien button {
      padding: 0;
      font-size: 26px;
      background-color: #f3c4d3;
      color: #8a2b4d;
      border-radius: 12px;
    }
    #dieuKhien button:active { background-color: #e0507d; color: white; }
    #len  { grid-column: 2; grid-row: 1; }
    #trai { grid-column: 1; grid-row: 2; }
    #xuong{ grid-column: 2; grid-row: 2; }
    #phai { grid-column: 3; grid-row: 2; }

    #huongDan { color: #555; font-size: 14px; margin-top: 12px; text-align: center; max-width: 420px; }
    #nutPhu { margin-top: 10px; }
    #nutTamDung { padding: 8px 18px; font-size: 15px; background-color: #f3c4d3; color: #8a2b4d; }
    #nutTamDung:hover { background-color: #e8a9bf; }
  </style>
</head>
<body>
  <h1>🐍 Rắn Săn Mồi</h1>

  <div class="bang">
    <div>Điểm: <span id="diem">0</span></div>
    <div>🏆 Kỷ lục: <span id="kyLuc">0</span></div>
  </div>

  <div id="khungGame">
    <canvas id="man"></canvas>
    <div id="phu">
      <h2 id="tieuDe">Sẵn sàng chưa?</h2>
      <p id="noiDung">Ăn táo để dài ra. Đừng đâm vào tường hay chính mình nhé!</p>
      <button id="nutBatDau">Bắt đầu chơi</button>
    </div>
  </div>

  <div id="dieuKhien">
    <button id="len">▲</button>
    <button id="trai">◀</button>
    <button id="xuong">▼</button>
    <button id="phai">▶</button>
  </div>

  <button id="nutTamDung" style="margin-top:12px;">⏸ Tạm dừng</button>

  <p id="huongDan">
    Máy tính: dùng phím mũi tên hoặc W A S D, phím Space để tạm dừng.<br>
    Điện thoại: vuốt trên màn hình game hoặc bấm các nút mũi tên.
  </p>

  <script>
    var LUOI = 20;                       // lưới 20 x 20 ô
    var canvas = document.getElementById("man");
    var ctx = canvas.getContext("2d");
    var oVuong = 20;                     // kích thước mỗi ô (tính lại theo màn hình)

    var ran, huong, hangDoi, moi, diem, tocDo, timer;
    var dangChay = false, tamDung = false;

    // ----- Kỷ lục lưu trên máy -----
    var kyLuc = 0;
    try { kyLuc = Number(localStorage.getItem("ranKyLuc")) || 0; } catch (e) {}
    document.getElementById("kyLuc").textContent = kyLuc;

    // ----- Âm thanh tạo bằng code -----
    function phatAmThanh(cacNot) {
      try {
        var AmCtx = window.AudioContext || window.webkitAudioContext;
        var ac = new AmCtx();
        cacNot.forEach(function (tanSo, i) {
          var dao = ac.createOscillator();
          var luong = ac.createGain();
          dao.type = "sine";
          dao.frequency.value = tanSo;
          dao.connect(luong);
          luong.connect(ac.destination);
          var bd = ac.currentTime + i * 0.12;
          luong.gain.setValueAtTime(0.2, bd);
          luong.gain.exponentialRampToValueAtTime(0.001, bd + 0.2);
          dao.start(bd);
          dao.stop(bd + 0.2);
        });
      } catch (e) {}
    }
    function amAn()   { phatAmThanh([660, 880]); }
    function amThua() { phatAmThanh([330, 262, 196]); }

    // ----- Kích thước vừa với màn hình -----
    function doiKichThuoc() {
      var r = Math.min(window.innerWidth - 40, 420);
      r = Math.max(200, Math.floor(r / LUOI) * LUOI);
      canvas.width = r;
      canvas.height = r;
      oVuong = r / LUOI;
      ve();
    }
    window.addEventListener("resize", doiKichThuoc);

    // ----- Bắt đầu / kết thúc -----
    function batDau() {
      clearTimeout(timer);
      ran = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      huong = { x: 1, y: 0 };
      hangDoi = [];
      diem = 0;
      tocDo = 150;
      tamDung = false;
      dangChay = true;
      document.getElementById("diem").textContent = 0;
      document.getElementById("nutTamDung").textContent = "⏸ Tạm dừng";
      document.getElementById("phu").style.display = "none";
      taoMoi();
      ve();
      timer = setTimeout(lap, tocDo);
    }

    function ketThuc() {
      dangChay = false;
      clearTimeout(timer);
      amThua();
      var moiKyLuc = diem > kyLuc;
      if (moiKyLuc) {
        kyLuc = diem;
        try { localStorage.setItem("ranKyLuc", String(kyLuc)); } catch (e) {}
        document.getElementById("kyLuc").textContent = kyLuc;
      }
      document.getElementById("tieuDe").textContent = "Game over! 😢";
      document.getElementById("noiDung").textContent =
        "Bạn được " + diem + " điểm." + (moiKyLuc && diem > 0 ? " 🏆 Kỷ lục mới!" : "");
      document.getElementById("nutBatDau").textContent = "Chơi lại";
      document.getElementById("phu").style.display = "flex";
    }

    function taoMoi() {
      var trung;
      do {
        moi = {
          x: Math.floor(Math.random() * LUOI),
          y: Math.floor(Math.random() * LUOI)
        };
        trung = ran.some(function (o) { return o.x === moi.x && o.y === moi.y; });
      } while (trung);
    }

    // ----- Vòng lặp game -----
    function lap() {
      if (!dangChay) return;
      if (!tamDung) buoc();
      if (dangChay) timer = setTimeout(lap, tocDo);
    }

    function buoc() {
      if (hangDoi.length > 0) huong = hangDoi.shift();

      var dau = { x: ran[0].x + huong.x, y: ran[0].y + huong.y };
      var an = (dau.x === moi.x && dau.y === moi.y);

      // Đâm tường
      if (dau.x < 0 || dau.y < 0 || dau.x >= LUOI || dau.y >= LUOI) {
        ketThuc();
        return;
      }

      // Cắn phải thân (đuôi sẽ rút đi nếu không ăn nên không tính)
      var than = an ? ran : ran.slice(0, ran.length - 1);
      var canPhai = than.some(function (o) { return o.x === dau.x && o.y === dau.y; });
      if (canPhai) {
        ketThuc();
        return;
      }

      ran.unshift(dau);

      if (an) {
        diem++;
        document.getElementById("diem").textContent = diem;
        amAn();
        tocDo = Math.max(70, tocDo - 4);   // càng ăn càng nhanh
        taoMoi();
      } else {
        ran.pop();
      }
      ve();
    }

    // ----- Vẽ -----
    function ve() {
      if (!ran) { // trước khi bắt đầu: vẽ nền
        veNen();
        return;
      }
      veNen();

      // Táo
      ctx.fillStyle = "#e53935";
      ctx.beginPath();
      ctx.arc(moi.x * oVuong + oVuong / 2, moi.y * oVuong + oVuong / 2, oVuong * 0.38, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#43a047";
      ctx.fillRect(moi.x * oVuong + oVuong / 2 - 1, moi.y * oVuong + oVuong * 0.1, 3, oVuong * 0.18);

      // Rắn
      ran.forEach(function (o, i) {
        ctx.fillStyle = (i === 0) ? "#2e7d32" : "#66bb6a";
        var le = 1;
        ctx.fillRect(o.x * oVuong + le, o.y * oVuong + le, oVuong - le * 2, oVuong - le * 2);
      });

      // Mắt rắn
      var d = ran[0];
      ctx.fillStyle = "#fff";
      var cx = d.x * oVuong + oVuong / 2, cy = d.y * oVuong + oVuong / 2;
      var mx = huong.y !== 0 ? oVuong * 0.2 : 0;   // lệch mắt theo hướng đi
      var my = huong.x !== 0 ? oVuong * 0.2 : 0;
      var fx = huong.x * oVuong * 0.15, fy = huong.y * oVuong * 0.15;
      ctx.beginPath();
      ctx.arc(cx + fx - mx, cy + fy - my, oVuong * 0.1, 0, Math.PI * 2);
      ctx.arc(cx + fx + mx, cy + fy + my, oVuong * 0.1, 0, Math.PI * 2);
      ctx.fill();
    }

    function veNen() {
      for (var x = 0; x < LUOI; x++) {
        for (var y = 0; y < LUOI; y++) {
          ctx.fillStyle = ((x + y) % 2 === 0) ? "#fff7fa" : "#ffeef3";
          ctx.fillRect(x * oVuong, y * oVuong, oVuong, oVuong);
        }
      }
    }

    // ----- Điều khiển -----
    function doiHuong(dx, dy) {
      if (!dangChay) return;
      var cuoi = hangDoi.length > 0 ? hangDoi[hangDoi.length - 1] : huong;
      if (dx === -cuoi.x && dy === -cuoi.y) return;   // không quay đầu 180 độ
      if (dx === cuoi.x && dy === cuoi.y) return;
      if (hangDoi.length < 2) hangDoi.push({ x: dx, y: dy });
    }

    function doiTamDung() {
      if (!dangChay) return;
      tamDung = !tamDung;
      document.getElementById("nutTamDung").textContent = tamDung ? "▶ Tiếp tục" : "⏸ Tạm dừng";
    }

    document.addEventListener("keydown", function (e) {
      var k = e.key;
      var dung = true;
      if (k === "ArrowUp" || k === "w" || k === "W") doiHuong(0, -1);
      else if (k === "ArrowDown" || k === "s" || k === "S") doiHuong(0, 1);
      else if (k === "ArrowLeft" || k === "a" || k === "A") doiHuong(-1, 0);
      else if (k === "ArrowRight" || k === "d" || k === "D") doiHuong(1, 0);
      else if (k === " ") doiTamDung();
      else if (k === "Enter" && !dangChay) batDau();
      else dung = false;
      if (dung) e.preventDefault();
    });

    document.getElementById("len").onclick   = function () { doiHuong(0, -1); };
    document.getElementById("xuong").onclick = function () { doiHuong(0, 1); };
    document.getElementById("trai").onclick  = function () { doiHuong(-1, 0); };
    document.getElementById("phai").onclick  = function () { doiHuong(1, 0); };
    document.getElementById("nutBatDau").onclick = batDau;
    document.getElementById("nutTamDung").onclick = doiTamDung;

    // Vuốt trên màn hình
    var batDauX = 0, batDauY = 0;
    canvas.addEventListener("touchstart", function (e) {
      batDauX = e.touches[0].clientX;
      batDauY = e.touches[0].clientY;
      e.preventDefault();
    }, { passive: false });
    canvas.addEventListener("touchend", function (e) {
      var t = e.changedTouches[0];
      var dx = t.clientX - batDauX;
      var dy = t.clientY - batDauY;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      if (Math.abs(dx) > Math.abs(dy)) doiHuong(dx > 0 ? 1 : -1, 0);
      else doiHuong(0, dy > 0 ? 1 : -1);
      e.preventDefault();
    }, { passive: false });

    // Khởi động
    doiKichThuoc();
  </script>
</body>
</html>
